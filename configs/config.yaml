defaults:
  - _self_
  - dataset: zju_377_mhr
  - pose_correction: direct
  - texture: shallow_mlp
  - rigid: skinning_field
  - non_rigid: hashgrid
  - option:
      - iter15k

hydra:
  run:
    dir: exp/${name}
  job:
    chdir: false

name: ${dataset_name}-${pose_name}-${rigid_name}-${non_rigid_name}-${texture_name}-${tag}
tag: default

model:
  gaussian:
    use_sh: true
    sh_degree: 3
    delay: 1000
    init_opacity: 0.1
  pose_correction:
    name: direct
    # disables gradient updates for this component's learnable parameters
    # (e.g. to freeze a pretrained/loaded checkpoint while training the rest)
    disable_grad: false
  deformer:
    rigid:
      disable_grad: false
    non_rigid:
      disable_grad: false
  texture:
    disable_grad: false

dataset:
  preload: true
  source_layout: prepared

  # DataLoader parallelism for the train split (see scripts/train.py). 0 keeps
  # loading in the main process (original behavior); >0 loads/prefetches in
  # background worker subprocesses to overlap CPU image decode with GPU work.
  # 2 captures the full observed speedup in sweeps (see PR/commit notes); more
  # workers cost linearly more host RAM (each is a forked copy holding the
  # precomputed per-frame pose tensors + mesh data) without further gains.
  num_workers: 2
  batch_size: 1

  mode: ${mode}
  test_mode: view
  predict_seq: 0
  freeview: false

  resolution: -1
  padding: 0.1
  white_background: false
  data_device: cuda
  eval: false

  canonical_norm_padding: 0.05
  jtr_norm_scale: 1.1
  canonical_pointcloud_n_points: 50000

opt:
  iterations: 60000
  grad_clip: 0.1

  # learning rates
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  sh_feature_rest_lr_ratio: 20.0

  pose_correction_lr: 1e-4
  rigid_lr: 1e-4
  non_rigid_lr: 1e-3
  lr_ratio: 0.01

  # loss weights
  lpips_type: vgg
  lambda_l1: 1.
  lambda_dssim: 0.
  lambda_perceptual: 1e-2
  mask_loss_type: l1
#  lambda_mask: [0.1,5000,0]
  lambda_mask: 0.1
  lambda_opacity: 0.
  lambda_skinning: [10,1000,0.1]
  lambda_pose: 0.
  lambda_aiap_xyz: 1.
  lambda_aiap_cov: 100.

  # densification configs
  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 45000
  densify_grad_threshold: 0.0002
  opacity_threshold: 0.05
  opacity_reset_value: 0.01
  densify_split_n: 2
  densify_split_scale_factor: 0.8
  prune_big_point_ws_ratio: 0.1
  sh_degree_up_interval: 1000
  densify_screen_size_threshold: 20

pipeline:
  convert_SHs_python: true
  compute_cov3D_python: true
  debug: false

debug_from: -1
detect_anomaly: false
test_iterations: []
test_interval: 2000
save_iterations: [30000]
seed: -1
checkpoint_iterations: []
start_checkpoint: null
wandb_disable: false

mode: train
load_ckpt: null
evaluate: true
clean: true
